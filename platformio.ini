; Ambiente de teste em host (sem hardware).
; O firmware ESP32 continua sendo compilado/gravado via Arduino IDE, intocado por este arquivo.

[platformio]
; Fontes do firmware ficam na raiz do projeto (padrão Arduino IDE), não em src/.
src_dir = .

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17
; Só arquivos de lógica pura (sem dependência de hardware) entram no build nativo.
build_src_filter = -<*> +<schedule_validation.cpp> +<schedule_persistence.cpp>
test_build_src = true
